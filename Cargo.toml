[package]
name = "bike-aid"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Telegram mutual-aid bot for cyclists"
repository = "https://github.com/Saint-Petersburg-cycling-society/VeloHelp-bot"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
webpki-root-certs = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Dogfood dependency. Pin checked on 2026-10-03.
teloxide-ui = { git = "https://github.com/Mar2ianen/teloxide-ui", rev = "70da4d21c327d70e18425eb97503e6b97e94a30e" }

# Keep teloxide on the same fork/revision as teloxide-ui until Rich Message
# support lands in a compatible upstream release.
teloxide = { git = "https://github.com/Mar2ianen/teloxide-fork", rev = "a6092220", default-features = false, features = ["outbound", "ctrlc_handler", "rustls"] }

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
