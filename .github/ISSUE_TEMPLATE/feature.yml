name: Предложение / Feature request
description: Идея улучшения / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача пользователя / User need
      description: Какую задачу это поможет решить / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение / Proposed behavior
    validations:
      required: true
