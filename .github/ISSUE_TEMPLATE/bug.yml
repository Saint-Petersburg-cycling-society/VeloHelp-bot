name: Ошибка / Bug report
description: Что пошло не так / Describe unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не публикуйте токены, личные ID и точную геопозицию. Do not include tokens, personal IDs or exact locations.
  - type: textarea
    id: steps
    attributes:
      label: Шаги / Steps to reproduce
      description: Какие действия привели к ошибке / Actions leading to the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение / Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / Version
      description: Commit или версия клиента Telegram / Commit or Telegram client version
